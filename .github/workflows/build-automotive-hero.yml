name: Build automotive hero media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-automotive-hero.yml'

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download automotive source imagery
        run: |
          mkdir -p assets .hero-src
          curl -L --fail -A 'Mozilla/5.0' 'https://images.unsplash.com/photo-1600880292089-90a7e086ee0c?q=90&w=2200&auto=format&fit=crop' -o .hero-src/mechanic.jpg
          curl -L --fail -A 'Mozilla/5.0' 'https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?q=90&w=2200&auto=format&fit=crop' -o .hero-src/service.jpg
          curl -L --fail -A 'Mozilla/5.0' 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=90&w=2200&auto=format&fit=crop' -o .hero-src/fleet.jpg

      - name: Prepare local hero images
        run: |
          ffmpeg -y -loglevel error -i .hero-src/mechanic.jpg -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" -q:v 2 assets/hero-mechanic.jpg
          ffmpeg -y -loglevel error -i .hero-src/fleet.jpg -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" -q:v 2 assets/hero-fleet.jpg

      - name: Render cinematic automotive background video
        run: |
          ffmpeg -y -loglevel error \
            -loop 1 -t 5 -i .hero-src/mechanic.jpg \
            -loop 1 -t 5 -i .hero-src/service.jpg \
            -loop 1 -t 5 -i .hero-src/fleet.jpg \
            -filter_complex "\
          [0:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,eq=brightness=-0.04:contrast=1.08:saturation=0.86,format=yuv420p[v0];\
          [1:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,eq=brightness=-0.04:contrast=1.08:saturation=0.86,format=yuv420p[v1];\
          [2:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,eq=brightness=-0.04:contrast=1.08:saturation=0.86,format=yuv420p[v2];\
          [v0][v1]xfade=transition=fade:duration=0.8:offset=4.2[v01];\
          [v01][v2]xfade=transition=fade:duration=0.8:offset=8.4,format=yuv420p[v]" \
            -map '[v]' -an -c:v libx264 -preset medium -crf 21 -movflags +faststart assets/hero-automotive.mp4

      - name: Commit generated hero media
        run: |
          rm -rf .hero-src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-mechanic.jpg assets/hero-fleet.jpg assets/hero-automotive.mp4
          if git diff --cached --quiet; then
            echo 'Hero media already current.'
            exit 0
          fi
          git commit -m 'Add automotive hero media'
          git push
